<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NusaBot - Asisten Kuliner Nusantara</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-info">
                <h1>🍲 NusaBot</h1>
                <p>Asisten Kuliner Nusantara Lo!</p>
            </div>
        </header>

        <main id="chat-box" class="chat-box">
            <div class="message bot">
                <div class="msg-content">Halo! Gue NusaBot, siap bahas kuliner enak dari Sabang sampai Merauke. Mau cari resep atau rekomendasi tempat makan hari ini?</div>
            </div>
        </main>

        <form id="chat-form" class="chat-input-area">
            <input type="text" id="user-input" placeholder="Tanya resep rendang dong..." autocomplete="off" required>
            <button type="submit" id="send-btn">Kirim</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
